name: Sync upstream

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # SYNC_TOKEN (PAT with workflow scope) is needed when upstream changes .github/workflows; GITHUB_TOKEN can't push those.
      - run: gh repo sync ${{ github.repository }} --source pbakaus/impeccable --branch main
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}
